name: Build Android app

on:
  push:
    branches: [main]          # drafts on other branches never replace the live app
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk DelgadoFamily.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Delgado Family app
          body: |
            Latest build of the Delgado Family Android app (build ${{ github.run_number }}).
            Download DelgadoFamily.apk below on your Android phone and open it to install or update.
          files: DelgadoFamily.apk
          make_latest: true
